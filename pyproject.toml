[project]
name = "remote-mcp-gateway"
version = "0.1.0"
description = "A remote MCP server for Claude and other MCP clients: shared-key auth, JSONL audit log, read-only tools, optional task delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
mcp-gateway = "mcp_gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM105"]
